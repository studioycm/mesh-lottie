<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hero Lottie GSAP Preview</title>
    <!-- Tailwind for rapid styling (similar to a modern WP setup) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background-color: #1b2d37;
            color: #ffffff;
            margin: 0;
            padding: 0;
            overflow-x: hidden;
        }

        /* * Important: Give the lottie container explicit dimensions or an aspect ratio
         * to prevent layout shifts and give the Canvas a defined drawing area.
         */
        #lottie-hero-container {
            width: 100%;
            max-width: 780px; /* Matching the 780x500 from your JSON */
            aspect-ratio: 780 / 500;
            margin: 0 auto;
        }

        #lottie-hero-container canvas,
        #lottie-hero-container svg {
            display: block;
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>

<!-- Hero Section -->
<section class="relative flex flex-col justify-between h-screen w-full pt-20" id="hero-section">

    <div class="z-10 flex flex-col items-center text-center px-4">
        <h1 class="text-5xl md:text-7xl font-bold mb-6 tracking-tight">Future of Payments</h1>
        <p class="text-lg md:text-xl text-gray-300 max-w-2xl">
            Experience seamless transactions. Scroll down to see the Lottie animation optimized for Safari and iOS performance.
        </p>
    </div>

    <!-- Lottie Container positioned at the bottom of the hero -->
    <div class="w-full pb-10 mt-auto flex justify-center items-end z-0">
        <div id="lottie-hero-container"></div>
    </div>

</section>

<!-- Room to scroll -->
<section class="h-[150vh] flex flex-col items-center justify-start pt-32 bg-[#14222a]">
    <h2 class="text-3xl font-semibold text-gray-400">Content below the fold...</h2>
    <p class="mt-4 text-gray-500">Keep scrolling to see the animation scrub back and forth.</p>
</section>

<!-- Required Libraries -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/lottie-web/5.12.2/lottie.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>

<script>
    // Register GSAP Plugin
    gsap.registerPlugin(ScrollTrigger);

    document.addEventListener("DOMContentLoaded", (event) => {

        const lottieContainer = document.getElementById('lottie-hero-container');

        // 1. URLs
        // Your WP Engine Staging URL
        const targetUrl = '/01_Hero_Lottie_v4_780_500.json';

        // Function to bind GSAP once any animation loads
        function initGSAPScroll(animInstance) {
            const totalFrames = animInstance.totalFrames - 1;

            ScrollTrigger.create({
                trigger: "#hero-section",
                start: "top top",
                end: "bottom top",
                scrub: 1,              // Smooth 1-second catch-up time
                onUpdate: self => {
                    const frame = self.progress * totalFrames;
                    animInstance.goToAndStop(frame, true);
                }
            });
        }

        // Attempt to load YOUR animation via proxy
        let lottieAnim = lottie.loadAnimation({
            container: lottieContainer,
            renderer: 'svg', // Currently set to SVG, canvas for optimization
            loop: false,
            autoplay: false,
            path: targetUrl
        });

        // If it succeeds, setup GSAP
        lottieAnim.addEventListener('DOMLoaded', () => {
            initGSAPScroll(lottieAnim);
        });

    });
</script>
</body>
</html>
