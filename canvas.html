<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hero Lottie GSAP Preview</title>
    <!-- Tailwind for rapid styling (similar to a modern WP setup) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background-color: #1b2d37;
            color: #ffffff;
            margin: 0;
            padding: 0;
            overflow-x: hidden;
        }

        /* Added ACF Block Hero CSS */
        .block-hero {
            height: 100vh;
            text-align: center;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            align-content: center;
            align-items: center;
            background-size: 1920px auto;
            background-position: bottom center;
            background-repeat: no-repeat;
            position: relative;
            padding: clamp(30px, (100vh - 800px) * 0.25 + 30px, 80px) 0 0;
        }

        .block-hero:before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            width: 100%;
            background: linear-gradient(180deg, #1b2d37 15.4%, rgba(27, 45, 55, 0) 100%);
            height: 526px;
        }

        .block-hero__visual {
            height: clamp(390px, (100vh - 800px) * 0.55 + 390px, 500px);
            margin: 0 auto;
            position: relative;
        }

        /* Fixed the typo from -:before to ::before */
        .block-hero__visual::before {
            content: "";
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            height: 123%;
            aspect-ratio: 0.707;
            border-radius: 100%;
            opacity: 0.2;
            background: #76e8d3;
            filter: blur(92px);
            pointer-events: none;
        }

        /* * Important: Give the lottie container explicit dimensions or an aspect ratio
         * to prevent layout shifts and give the Canvas a defined drawing area.
         */
        #lottie-hero-container {
            width: 100%;
            max-width: 780px; /* Matching the 780x500 from your JSON */
            aspect-ratio: 780 / 500;
            margin: 0 auto;
        }
        #lottie-hero-container canvas {
            width: 780px; /* Matching the 780x500 from your JSON */
            aspect-ratio: 780 / 500;
        }
        #lottie-hero-container canvas,
        #lottie-hero-container svg {
            display: block;
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>

<!-- Hero Section -->
<section class="block-hero" id="hero-section" style="background-image:url(/backkk-1-scaled.jpg.webp)">

    <div class="z-10 flex flex-col items-center text-center px-4 relative">
        <h1 class="text-5xl md:text-7xl font-bold mb-6 tracking-tight">Future of Payments</h1>
        <p class="text-lg md:text-xl text-gray-300 max-w-2xl mx-auto">
            Experience seamless transactions. Scroll down to see the Lottie animation optimized for Safari and iOS performance.
        </p>
    </div>

    <!-- Lottie Container positioned at the bottom of the hero -->
    <div class="block-hero__visual z-0">
        <div id="lottie-hero-container" class="block-hero__lottie"></div>
    </div>

</section>

<!-- Room to scroll -->
<section class="h-[150vh] flex flex-col items-center justify-start pt-32 bg-[#14222a]">
    <h2 class="text-3xl font-semibold text-gray-400">Content below the fold...</h2>
    <p class="mt-4 text-gray-500">Keep scrolling to see the animation scrub back and forth.</p>
</section>

<!-- Required Libraries -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/lottie-web/5.12.2/lottie.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>

<script>
    // Register GSAP Plugin
    gsap.registerPlugin(ScrollTrigger);

    document.addEventListener("DOMContentLoaded", (event) => {

        const lottieContainer = document.getElementById('lottie-hero-container');

        // Local path assuming the JSON is in the same folder on staging
        const targetUrl = '/01_Hero_Lottie_v4_780_500.json';

        // Function to bind GSAP once any animation loads
        function initGSAPScroll(animInstance) {

            // Frame where the intro ends and the Lottie is fully visible in the sweet spot
            // (Based on your original ACF data-lottie-pause="63")
            const sweetSpotFrame = 28;
            const endFrame = animInstance.totalFrames;

            // Immediately set the animation to the fully visible sweet spot on load
            animInstance.goToAndStop(sweetSpotFrame, true);

            ScrollTrigger.create({
                trigger: "#hero-section",
                start: "150px top",       // Trigger disappearing when top of viewport is 300px down the section
                end: "bottom top+=300px", // Trigger reverse when top of viewport scrolls up to 300px from the bottom
                onEnter: () => {
                    // Play ONLY the disappearing segment (sweet spot -> end)
                    animInstance.playSegments([sweetSpotFrame, endFrame], true);
                },
                onEnterBack: () => {
                    // Play the disappearing segment backwards to reappear smoothly (end -> sweet spot)
                    animInstance.playSegments([endFrame, sweetSpotFrame], true);
                },
                onLeaveBack: () => {
                    // Lock it securely at the sweet spot if scrolled entirely above the trigger
                    // animInstance.goToAndStop(sweetSpotFrame, true);
                    animInstance.playSegments([endFrame, sweetSpotFrame], true);
                }
            });
        }

        // Attempt to load YOUR animation natively
        let lottieAnim = lottie.loadAnimation({
            container: lottieContainer,
            renderer: 'canvas', // <--- OPTIMIZATION: Fixed to Canvas for better iOS/Safari performance
            loop: false,
            autoplay: false,
            path: targetUrl
        });

        // If it succeeds, setup GSAP
        lottieAnim.addEventListener('DOMLoaded', () => {
            initGSAPScroll(lottieAnim);
        });

    });
</script>
</body>
</html>
